version: '3.8'

services:
  mailhog:
    image: mailhog/mailhog:latest
    container_name: thank-you-mailhog
    ports:
      - "1026:1025"
      - "8025:8025"
    environment:
      - MH_STORAGE=memory
      - MH_SMTP_BIND_ADDR=0.0.0.0:1025
      - MH_UI_BIND_ADDR=0.0.0.0:8025
      - MH_API_BIND_ADDR=0.0.0.0:8025
    networks:
      - thank-you-network

  postgres:
    image: postgres:15
    container_name: thank-you-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=thankyoucards
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - thank-you-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thankyoucards"]
      interval: 30s
      timeout: 10s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: thank-you-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@thankyoucards.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - thank-you-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:

networks:
  thank-you-network:
    driver: bridge
